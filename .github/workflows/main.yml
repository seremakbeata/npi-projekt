name: Main Pipeline
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    uses: ./.github/workflows/reusable.yml
    with:
      should_build: true
      should_push: true
    permissions:
      packages: write
      contents: read

  custom-action-demo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Moja własna akcja
        id: my-action
        run: |
          echo "🎯 ================================="
          echo "🚀 WŁASNA AKCJA GITHUB ACTIONS"
          echo "📅 Data: $(date)"
          echo "👤 Autor: ${{ github.actor }}"
          echo "📁 Repo: ${{ github.repository }}"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "🎯 ================================="
          
          echo "action-name=custom-devops-action" >> $GITHUB_OUTPUT
          echo "executed-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Pokaż wyniki
        run: |
          echo "✅ Akcja wykonana pomyślnie!"
          echo "📝 Nazwa: ${{ steps.my-action.outputs.action-name }}"
          echo "⏰ Czas: ${{ steps.my-action.outputs.executed-at }}"
          echo "📊 Status: ${{ steps.my-action.outputs.status }}"